<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>投資觀察站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent-red: #ef4444; --accent-yellow: #f59e0b; --accent-green: #10b981; --border: #334155; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        .marquee { background: #1e293b; color: #fbbf24; padding: 12px; overflow: hidden; white-space: nowrap; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; font-weight: bold; }
        .marquee-inner { display: inline-block; animation: move 25s linear infinite; }
        @keyframes move { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--card); border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border); overflow: hidden; }
        .card-header { padding: 15px 20px; font-weight: bold; background: rgba(0,0,0,0.2); }
        .red-l { border-left: 6px solid var(--accent-red); color: var(--accent-red); }
        .yellow-l { border-left: 6px solid var(--accent-yellow); color: var(--accent-yellow); }
        .green-l { border-left: 6px solid var(--accent-green); color: var(--accent-green); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: rgba(0,0,0,0.1); color: #94a3b8; font-size: 0.8rem; text-align: left; padding: 12px 20px; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="marquee"><div class="marquee-inner" id="mq_display">連線中...</div></div>
    <div class="container" id="content">載入中...</div>

    <script>
        const SB_URL = 'https://twifrdbdounfujiqhght.supabase.co';
        const SB_KEY = '你的_ANON_KEY';
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        async function loadViewer() {
            const { data: set } = await supabase.from('settings').select('*').single();
            if(set) document.getElementById('mq_display').innerText = set.marquee_text;

            const { data: stocks } = await supabase.from('stocks').select('*');
            renderUI(stocks || []);
        }

        function renderUI(stocks) {
            const groups = { 
                red: { title: '🔴 短期 (3個月)', class: 'red-l' },
                yellow: { title: '🟡 中長 (3-6個月)', class: 'yellow-l' },
                green: { title: '🟢 長線 (1年以上)', class: 'green-l' }
            };

            let html = '';
            for (let key in groups) {
                const filtered = stocks.filter(s => s.level === key);
                html += `
                <div class="card">
                    <div class="card-header ${groups[key].class}">${groups[key].title}</div>
                    <div style="overflow-x:auto">
                        <table>
                            <thead><tr><th>名稱</th><th>日期</th><th>價格</th><th>理由</th><th>狀態</th></tr></thead>
                            <tbody>
                                ${filtered.length ? filtered.map(s => `
                                    <tr>
                                        <td><b>${s.name}</b></td>
                                        <td>${s.buy_date}</td>
                                        <td>${s.buy_price} <br><small style="color:var(--accent-red)">${s.limit_price}</small></td>
                                        <td style="max-width:200px">${s.reason}</td>
                                        <td>${s.status}</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="5" style="text-align:center">目前無資料</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }
            document.getElementById('content').innerHTML = html;
        }

        supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public' }, () => loadViewer()).subscribe();
        loadViewer();
    </script>
</body>
</html>
