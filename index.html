<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>投資觀察站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --red: #ef4444; --yellow: #f59e0b; --green: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; line-height: 1.5; }
        .marquee { background: #1e293b; color: #fbbf24; padding: 15px; overflow: hidden; white-space: nowrap; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 100; font-weight: bold; font-size: 1.1rem; }
        .marquee-inner { display: inline-block; animation: move 20s linear infinite; }
        @keyframes move { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card); border-radius: 15px; margin-bottom: 25px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-header { padding: 15px 20px; font-weight: bold; background: rgba(0,0,0,0.3); font-size: 1.1rem; display: flex; align-items: center; }
        .red-h { border-left: 8px solid var(--red); color: var(--red); }
        .yellow-h { border-left: 8px solid var(--yellow); color: var(--yellow); }
        .green-h { border-left: 8px solid var(--green); color: var(--green); }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(0,0,0,0.2); text-align: left; padding: 12px 20px; font-size: 0.85rem; color: #94a3b8; }
        td { padding: 18px 20px; border-bottom: 1px solid #334155; }
        .empty { padding: 40px; text-align: center; color: #64748b; }
    </style>
</head>
<body>
    <div class="marquee"><div class="marquee-inner" id="mq_display">📡 正在與伺服器連線...</div></div>
    <div class="container" id="content"></div>

    <script>
        const SB_URL = 'https://twifrdbdounfujiqhght.supabase.co';
        const SB_KEY = 'sb_publishable_OGGoB158Uy2q1h5-jREvOA_683tvRv7';
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        async function loadData() {
            const { data: set } = await supabase.from('settings').select('marquee_text').eq('id', 1).single();
            if(set) document.getElementById('mq_display').innerText = set.marquee_text;

            const { data: stocks } = await supabase.from('stocks').select('*');
            render(stocks || []);
        }

        function render(stocks) {
            const config = {
                red: { t: '🔴 短期觀察標的', c: 'red-h' },
                yellow: { t: '🟡 中長週期佈局', c: 'yellow-h' },
                green: { t: '🟢 長線核心持有', c: 'green-h' }
            };
            let html = '';
            ['red', 'yellow', 'green'].forEach(lv => {
                const list = stocks.filter(s => s.level === lv);
                html += `
                <div class="card">
                    <div class="card-header ${config[lv].c}">${config[lv].t}</div>
                    <div style="overflow-x:auto">
                        <table>
                            <thead><tr><th>標的名稱</th><th>買入日期</th><th>買入/目標</th><th>分析理由</th><th>目前狀態</th></tr></thead>
                            <tbody>
                                ${list.length ? list.map(s => `
                                    <tr>
                                        <td><b>${s.name}</b></td>
                                        <td>${s.buy_date || '-'}</td>
                                        <td>${s.buy_price} <br><small style="color:#94a3b8">→ ${s.limit_price}</small></td>
                                        <td style="max-width:300px; font-size: 0.9rem;">${s.reason}</td>
                                        <td><span style="background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:4px;">${s.status}</span></td>
                                    </tr>`).join('') : '<tr><td colspan="5" class="empty">此區域尚無紀錄</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            });
            document.getElementById('content').innerHTML = html;
        }

        supabase.channel('db-changes').on('postgres_changes', { event: '*', schema: 'public' }, () => loadData()).subscribe();
        loadData();
    </script>
</body>
</html>
